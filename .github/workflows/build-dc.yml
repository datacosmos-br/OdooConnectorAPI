name: build-dc

# DataCosmos image build. Pushes ghcr.io/datacosmos-br/odooconnectorapi:<version>-dc1.
# All of this repo is DataCosmos code, so every build carries the -dc1 suffix.
on:
  push:
    branches: [datacosmos]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (default: latest)"
        required: false
        default: latest

env:
  IMAGE: ghcr.io/datacosmos-br/odooconnectorapi
  DC_VERSION: ${{ github.event.inputs.version || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.DC_VERSION }}-dc1
            ${{ env.IMAGE }}:latest-dc1
            ${{ env.IMAGE }}:sha-${{ github.sha }}
