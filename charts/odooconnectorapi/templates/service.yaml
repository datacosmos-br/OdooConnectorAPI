apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.name" . }}
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
  selector:
    app: {{ include "chart.name" . }}
